# ==============================================================================
# rtmonitor-api — Deployment (3 replicas) + Service
#
# Exposes the RTM backend on 8080. /health (mapped in Program.cs) drives the
# liveness + readiness probes. Redis is expected as the "redis" Service in the
# same namespace (see redis.yaml) — no secrets are stored here.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtmonitor-api
  labels:
    app.kubernetes.io/name: rtmonitor-api
    app.kubernetes.io/part-of: rtmonitor
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rtmonitor-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rtmonitor-api
    spec:
      containers:
        - name: api
          image: rtmonitor-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # Redis connection string pointing at the in-cluster "redis" Service.
            # Double-underscore maps to the ":" configuration key.
            - name: Redis__Configuration
              value: "redis:6379"
            - name: Redis__Enabled
              value: "true"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: rtmonitor-api
  labels:
    app.kubernetes.io/name: rtmonitor-api
    app.kubernetes.io/part-of: rtmonitor
spec:
  selector:
    app.kubernetes.io/name: rtmonitor-api
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
